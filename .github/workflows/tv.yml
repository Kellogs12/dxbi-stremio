name: Android apps

# Builds Hank TV (Android TV / Fire TV) and Hank for Android phones.
# Triggers on push, release, or manual run.
on:
  push:
    paths:
      - 'tv/**'
      - 'dxbi.plugin.js'
      - '.github/workflows/tv.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup signing key
        run: |
          if [ -n "${{ secrets.DXBI_TV_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DXBI_TV_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/hank-tv.jks"
            echo "KEYSTORE_PASS=${{ secrets.DXBI_TV_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.DXBI_TV_KEY_PASSWORD || secrets.DXBI_TV_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.DXBI_TV_KEY_ALIAS || 'dxbi-tv' }}" >> $GITHUB_ENV
          else
            echo "Generating release signing keystore..."
            keytool -genkey -v -keystore "$RUNNER_TEMP/hank-tv.jks" -alias hank-tv -keyalg RSA -keysize 2048 -validity 10000 -storepass hankpassword -keypass hankpassword -dname "CN=Hank, OU=Hank, O=Hank, L=Unknown, S=Unknown, C=US"
            echo "KEYSTORE_PASS=hankpassword" >> $GITHUB_ENV
            echo "KEY_PASS=hankpassword" >> $GITHUB_ENV
            echo "KEY_ALIAS=hank-tv" >> $GITHUB_ENV
          fi

      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches what's missing
      - name: Build APKs
        run: |
          ./gradlew assembleTvRelease assembleMobileRelease --no-daemon
          cp app/build/outputs/apk/tv/release/app-tv-release.apk hank-tv.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk hank-mobile.apk
          cp hank-tv.apk dxbi-tv.apk
          cp hank-mobile.apk dxbi-mobile.apk
        env:
          DXBI_TV_KEYSTORE: ${{ runner.temp }}/hank-tv.jks
          DXBI_TV_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          DXBI_TV_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          DXBI_TV_KEY_PASSWORD: ${{ env.KEY_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: hank-android
          path: |
            tv/hank-tv.apk
            tv/hank-mobile.apk
            tv/dxbi-tv.apk
            tv/dxbi-mobile.apk
          if-no-files-found: error

      - name: Attach to release if present
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" hank-tv.apk hank-mobile.apk dxbi-tv.apk dxbi-mobile.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
